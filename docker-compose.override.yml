# Development overrides for docker-compose
# This file is automatically loaded by docker-compose for local development

version: '3.8'

services:
  processor:
    # Enable development mode
    environment:
      - LOG_LEVEL=DEBUG
      - FLASK_ENV=development
    # Mount source code for live reloading
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
    # Add development ports
    ports:
      - "8000:8000"  # Metrics endpoint

  dashboard:
    # Enable development mode
    environment:
      - FLASK_ENV=development
    # Mount templates for live reloading and make data writable
    volumes:
      - ./dashboard:/app/dashboard:ro
      - ./templates:/app/templates:ro
      - ./data:/app/data:rw  # Make data directory writable
    # Enable debug mode
    command: ["python", "dashboard/app.py"]

  redis:
    # Expose Redis port for debugging (using different port to avoid conflicts)
    ports:
      - "6380:6379"