# Mike Logger Configuration
# This file contains default settings that can be overridden by environment variables

audio:
  sample_rate: 16000
  channels: 1
  chunk_size: 1024
  
segmentation:
  min_duration: 5.0     # seconds
  max_duration: 120.0   # seconds
  silence_threshold: 2.0 # seconds
  vad_aggressiveness: 2  # 0-3

whisper:
  model: base
  language: en
  temperature: 0.0

processing:
  interval: 30          # seconds between file checks
  keep_audio_files: false
  
task_extraction:
  model: claude-3-haiku-20240307
  max_tokens: 1000
  temperature: 0.1

retention:
  audio_hours: 24
  transcript_days: 30
  task_days: 365